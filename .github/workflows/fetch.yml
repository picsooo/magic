name: fetch-assets
on:
  push:
    paths: ['tools/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p raw
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL -A "Mozilla/5.0" -o "raw/$name.jpg" "$url" || echo "fail $name"
          done < tools/urls.txt
          ls -la raw
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add raw
          git commit -m "fetch assets" || true
          git push
