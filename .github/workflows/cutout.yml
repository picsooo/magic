name: cutout
on:
  push:
    paths: ['crops/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install "rembg[cpu,cli]" pillow
      - name: Cutout
        run: |
          mkdir -p cut
          for f in crops/*.png; do
            n=$(basename "$f")
            rembg i -m birefnet-general -a "$f" "cut/$n" || rembg i -m isnet-general-use "$f" "cut/$n"
          done
          ls -la cut
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add cut; git commit -m "cutouts" || true; git pull --rebase; git push
